{% extends "base.html" %}

{% block main_content %}

<h1>Feed</h1>
<!--displays all post-->
{% if post %}
<div class="postgrid">
    {% for p in post %}
        <div class="post">
            <h3>{{ p.title }}</h3>
            <p>{{ p.description }}</p>

            {% if p.file_name %}
                <img src="{{ url_for('uploaded_file', filename = p.file_name) }}"
                alt="{{ p.title }}">
                <a href="{{ url_for('uploaded_file', filename=p.file_name) }}"
                target="_blank">
                Open image</a>
            {% endif %}
            <br>
            <p>Expires on: {{ p.exp_date }}</p>
        </div>
    {% endfor %}
</div>
{% else %}
    <p>No post yet!</p>
{% endif %}


{% endblock %}
