{% extends "base.html" %}

{% block main_content %}

<h1>Feed</h1>
<!--displays all post-->
{% if post %}
<div class="postgrid">
    {% for p in post %}
        <div class="post">
            <h3>{{ p.title }}</h3>
        </div>
    {% endfor %}
</div>
{% else %}
    <p>No post yet!</p>
{% endif %}


{% endblock %}
