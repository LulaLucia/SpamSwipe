<!--code will be similar to that of profile-->
{% extends "base.html" %}

{% block main_content %}



<h1>Saved Posts</h1>
<table>
  <!--<form>
    <label for="date">Filter by Date:</label>
      <input type="date" id="date" name="date" min="2026-10-11" required />
  </form> -->

  
  <!--displays saved posts-->
{% if savedpost %}
<div class="postgrid">
    {% for p in savedpost %}
        <div class="post">
            <h3>{{ p.title }}</h3>
            <p>{{ p.description }}</p>

            {% if p.file_name %}
                <img src="{{ url_for('uploaded_file', filename = p.file_name) }}"
                alt="{{ p.title }}">
                <a href="{{ url_for('uploaded_file', filename=p.file_name) }}"
                target="_blank">
                Open image</a>
                
            {% endif %}
            <br>
            <p>Expires on: {{ p.exp_date }}</p>

             <!-- form to unsave post -->
              <form method="POST"
              action="{{ url_for('unsave_post', post_id = p.post_id )}}"
              onsubmit="return confirm('Are you sure you want to unsave this post?');">
              <button type="submit">Unsave</button>
            </form>

        </div>
    {% endfor %}
</div>
{% else %}
    <p>Nothing saved yet!</p>
{% endif %}

{% endblock %}
