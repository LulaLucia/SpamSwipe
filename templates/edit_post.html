Allows user to fill out a form to edit post they have created.-->

{% extends "base.html" %}

{% block main_content %}

<h1>Edit Post</h1>

<form method="POST" action="{{url_for('edit_post', post_id=post.post_id)}}"> 
    <label for="title">Edit Title:</label>
      <input type="text" id="title" 
      name="title" value="{{ post.title }}"
      required>
      <br>

      <label for="description">Edit Description:</label>
      <input type="text" id="description" 
      name="description" value ="{{ post.description or '' }}">
      <br>

      <!-- 
      <label for="tag">Edit Tags:</label>
      <input type="text" id="tag" name="tag" >
      <br>
      -->

      <label for="exp_date">Edit Expiry Date:</label>
      <!-- change to date type in table? -->
      <input type="date" id="exp_date" name="exp_date" 
      min="2026-10-11" value="{{ post.exp_date }}"
      required />
      <br>

      <label for="visibility">Edit Visibility</label>
      <select name="visibility" id="visibility" required>
        <option value="" disabled selected>Pick One</option>
        <option value="public"
        {% if post.public %}selected{% endif %}
        >Public</option>
        <option value="private"
        {% if not post.public %}selected{% endif %}
        >Private</option>
     </select>
     <br>

     <br><br>

     <!-- 
     <label for="picfile">Edit File:</label>
    <input type="file" name="file_name" accept="image/*" required></label>
     -->
    
  <button type="submit">Submit Changes</button>

</form>


{% endblock %}
